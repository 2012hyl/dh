        // 解析静态像素并绘制
        const pixels = [];
        shadowStr.split(',').map(item => item.trim()).forEach(item => {
            const parts = item.match(/(\d+)px\s+(\d+)px\s+\d+\s+\d+\s+(#[0-9A-Fa-f]+)/);
            if (parts) {
                // 原像素为5px，缩放至24x24网格
                pixels.push({
                    x: parseInt(parts[1]) / 5,
                    y: parseInt(parts[2]) / 5,
                    c: parts[3]
                });
            }
        });

        // 动画状态
        let handY = 0;
        let frame = 0;
        let steams = [];

        function draw() {
            frame++;
            ctx.clearRect(0, 0, 24, 24);

            // 1. 绘制猫咪身体（静态）
            pixels.forEach(p => {
                ctx.fillStyle = p.c;
                ctx.fillRect(p.x, p.y, 1, 1);
            });

            // 2. 打字的手（上/下移动）
            if (frame % 6 === 0) handY = (handY === 0 ? 1 : 0); // 0.1s 切换一次
            ctx.fillStyle = '#FCA503';
            ctx.fillRect(12, 12 + handY, 1, 1);
            ctx.fillRect(13, 12 + handY, 1, 1);
            ctx.fillRect(12, 13 + handY, 1, 1);
            ctx.fillRect(13, 13 + handY, 1, 1);

            // 3. 打哈欠的嘴巴（3秒一次）
            const mouthCycle = frame % 180;
            if (mouthCycle > 144 && mouthCycle < 162) {
                ctx.fillStyle = '#222';
                ctx.fillRect(16, 11, 2, 2);
            }

            // 4. 屏幕发光（闪烁）
            const glow = Math.sin(frame * 0.15) * 0.2 + 0.5;
            ctx.fillStyle = `rgba(168, 216, 234, ${glow})`;
            ctx.fillRect(4, 4, 8, 13);

            // 5. 热气升起（每1.5秒冒一次）
            if (frame % 90 === 0) {
                steams.push({ x: 22, y: 14, life: 0 });
            }
            for (let i = steams.length - 1; i >= 0; i--) {
                let s = steams[i];
                s.y -= 0.2;
                s.life++;
                if (s.life > 50) {
                    steams.splice(i, 1);
                    continue;
                }
                const alpha = (1 - s.life / 50) * 0.7;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
            }

            requestAnimationFrame(draw);
        }

        draw();
