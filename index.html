            [30,26,'#333'],[31,26,'#333'],[32,26,'#333'],[41,26,'#333'],[42,26,'#333'],[43,26,'#333'],
            [31,27,'#333'],[32,27,'#333'],[41,27,'#333'],[42,27,'#333'],
            
            // 眼睛
            [35,24,'#222'],[36,24,'#222'],[38,24,'#222'],[39,24,'#222'],
            [35,25,'#222'],[36,25,'#222'],[38,25,'#222'],[39,25,'#222'],

            // 胡须 (左右各三根)
            [26,28,'#B0BEC5'],[27,28,'#B0BEC5'],[28,28,'#B0BEC5'],
            [26,30,'#B0BEC5'],[27,30,'#B0BEC5'],[28,30,'#B0BEC5'],
            [26,32,'#B0BEC5'],[27,32,'#B0BEC5'],[28,32,'#B0BEC5'],
            
            [47,28,'#B0BEC5'],[48,28,'#B0BEC5'],[49,28,'#B0BEC5'],
            [47,30,'#B0BEC5'],[48,30,'#B0BEC5'],[49,30,'#B0BEC5'],
            [47,32,'#B0BEC5'],[48,32,'#B0BEC5'],[49,32,'#B0BEC5'],
            
            // 红领巾/领带
            [35,29,'#E74C3C'],[36,29,'#E74C3C'],[37,29,'#E74C3C'],[38,29,'#E74C3C'],[39,29,'#E74C3C'],
            [36,30,'#E74C3C'],[37,30,'#E74C3C'],[38,30,'#E74C3C'],
            [37,31,'#E74C3C'],

            // === 鼠标连线 ===
            [22,58,'#333'],[23,58,'#333'],[24,58,'#333'],[25,58,'#333'],[26,58,'#333'],
            [26,57,'#333'],[26,56,'#333'],
            [25,55,'#333'],[26,55,'#333'],
            [26,54,'#333'],[26,53,'#333'],
        ];

        // 帧动画循环 (打字手，屏幕呼吸，咖啡冒热气)
        let frame = 0;
        const handOffsetY = [0, 0, 0, 1, 1, 1]; // 模拟键盘按压
        let steamParticles = [];

        function draw() {
            ctx.clearRect(0, 0, 78, 78);
            frame++;

            // 1. 绘制静态像素底板
            pixelData.forEach(p => {
                ctx.fillStyle = p[2];
                ctx.fillRect(p[0], p[1], 1, 1);
            });

            // 2. 屏幕蓝光呼吸 (柔和，不刺眼)
            const glow = Math.sin(frame * 0.02) * 0.15 + 0.35;
            ctx.fillStyle = `rgba(168, 216, 234, ${glow})`;
            ctx.fillRect(14, 30, 12, 10);

            // 3. 手部打字动画 (猫的手在键盘上方上下浮动)
            const handPos = handOffsetY[frame % handOffsetY.length];
            // 猫的右手
            ctx.fillStyle = '#FCA503';
            ctx.fillRect(45, 47 + handPos, 3, 4);
            ctx.fillRect(41, 48 + handPos, 3, 4);
            // 猫的左手 (稍微靠左)
            ctx.fillRect(30, 46 + handPos, 3, 4);

            // 4. 咖啡杯冒热气
            if (frame % 8 === 0) {
                steamParticles.push({ x: 61 + (Math.random() * 2 - 1), y: 56, size: 2 + Math.random() * 2 });
            }
            
            // 更新和绘制热气
            for (let i = steamParticles.length - 1; i >= 0; i--) {
                let s = steamParticles[i];
                s.y -= 0.3;
                s.x += (Math.random() - 0.5) * 0.4;
                s.size += 0.1;
                
                if (s.y < 40 || s.size > 6) {
                    steamParticles.splice(i, 1);
                    continue;
                }
                const alpha = (s.y - 40) / 16;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
