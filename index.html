        // 4帧眼睛状态，实现极致眨眼与呼吸感

        const EYE_HALF = 1;
        const EYE_CLOSE = 2;
        const EYE_SQUINT = 3;

        let frame = 0;
        let eyeState = EYE_OPEN;
        let stateTimer = 0;
        let handPhase = 0;
        let particles = [];

        // 提前填充大量粒子
        for(let i=0; i<50; i++) {
            particles.push({
                x: Math.random() * 78, y: Math.random() * 78,
                vx: (Math.random()-0.5) * 0.5, vy: (Math.random()-0.5) * 0.5 - 0.2,
                r: Math.random() * 3, a: 0.1 + Math.random() * 0.3
            });
        }

        function draw() {
            ctx.clearRect(0, 0, 78, 78);
            frame++;

            // 1. 极限载入静态像素阵列
            P.forEach(p => {
                ctx.fillStyle = p[2];
                ctx.fillRect(p[0], p[1], 1, 1);
            });

            // 2. 屏幕呼吸光效 (非线性呼吸)
            const pulse = Math.sin(frame * 0.025) * 0.5 + 0.5;
            const glowAlpha = 0.15 + pulse * 0.3;
            ctx.fillStyle = `rgba(168, 216, 234, ${glowAlpha})`;
            ctx.fillRect(17, 31, 10, 8);

            // 3. 4帧眨眼循环 (顶级动态)
            stateTimer++;
            if(stateTimer > 80) { // 约1.3秒切换一次状态
                stateTimer = 0;
                eyeState = (eyeState + 1) % 4;
            }

            let eyePosX = 37, eyePosY = 29, eyeWidth = 6, eyeHeight = 4;
            if(eyeState === EYE_OPEN) {
                // 完全睁开 (不需要遮盖，原图就有瞳孔)
            } else if(eyeState === EYE_HALF) {
                ctx.fillStyle = C.O2;
                ctx.fillRect(eyePosX, eyePosY + 2, eyeWidth, 2); // 半遮
            } else if(eyeState === EYE_CLOSE) {
                ctx.fillStyle = C.O2;
                ctx.fillRect(eyePosX, eyePosY, eyeWidth, 4); // 全遮
            } else if(eyeState === EYE_SQUINT) {
                ctx.fillStyle = C.O2;
                ctx.fillRect(eyePosX, eyePosY + 1, eyeWidth, 2); // 眯眼
            }

            // 4. 极限打字手 (高频精细动作)
            handPhase = Math.sin(frame * 0.15) * 0.8;
            ctx.fillStyle = C.O2;
            ctx.fillRect(51, 47 + handPhase, 3, 3);
            ctx.fillRect(48, 48 + handPhase, 3, 3);
            ctx.fillRect(53, 49 + handPhase, 2, 2);

            // 5. 无限粒子风暴 (环绕环境光)
            particles.forEach(p => {
                p.x += p.vx + Math.sin(frame * 0.01 + p.y * 0.1) * 0.05;
                p.y += p.vy;
                if(p.y < 0) { p.y = 78; p.x = Math.random() * 78; }
                if(p.x < 0 || p.x > 78) { p.vx *= -1; }
                
                ctx.globalAlpha = p.a;
                ctx.fillStyle = '#8892b0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 6. 咖啡热气 (极限粒子)
            if(frame % 6 === 0) {
                particles.push({
                    x: 62 + (Math.random() - 0.5) * 4,
                    y: 51,
                    vx: (Math.random() - 0.5) * 0.1,
                    vy: -0.3 - Math.random() * 0.4,
                    r: 2 + Math.random() * 3,
                    a: 0.4 + Math.random() * 0.3
                });
            }

            // 清理死粒子 (保持性能)
            if(particles.length > 100) {
                particles.splice(0, 50);
            }

            requestAnimationFrame(draw);
        }

        draw();
